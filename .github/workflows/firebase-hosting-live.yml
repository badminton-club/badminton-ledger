name: Deploy to Firebase Hosting (live)

on:
  push:
    branches:
      - main

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            functions/package-lock.json

      - name: Configure Gmail backend
        env:
          GMAIL_OAUTH_REDIRECT_URI: ${{ vars.PROD_GMAIL_OAUTH_REDIRECT_URI }}
          GMAIL_ALLOWED_ORIGINS: ${{ vars.PROD_GMAIL_ALLOWED_ORIGINS }}
        run: |
          test -n "$GMAIL_OAUTH_REDIRECT_URI" || { echo "::error::Set the PROD_GMAIL_OAUTH_REDIRECT_URI repository variable"; exit 1; }
          test -n "$GMAIL_ALLOWED_ORIGINS" || { echo "::error::Set the PROD_GMAIL_ALLOWED_ORIGINS repository variable"; exit 1; }
          printf 'GMAIL_OAUTH_REDIRECT_URI=%s\nGMAIL_ALLOWED_ORIGINS=%s\n' \
            "$GMAIL_OAUTH_REDIRECT_URI" "$GMAIL_ALLOWED_ORIGINS" > functions/.env.badminton-ledger-prod

      - name: Install backend dependencies
        working-directory: functions
        run: npm ci

      - name: Test Gmail backend
        working-directory: functions
        run: npm test

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build
        working-directory: ui
        env:
          # CRA treats warnings as errors in CI; keep the build from failing on them.
          CI: false
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.PROD_REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.PROD_REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.PROD_REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.PROD_REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PROD_REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.PROD_REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.PROD_REACT_APP_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Authenticate Firebase deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules and indexes
        run: npx --yes firebase-tools@15.28.1 deploy --only firestore:rules,firestore:indexes --project badminton-ledger-prod --non-interactive

      - name: Deploy Gmail backend
        run: npx --yes firebase-tools@15.28.1 deploy --only functions:gmail --project badminton-ledger-prod --non-interactive

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: badminton-ledger-prod
