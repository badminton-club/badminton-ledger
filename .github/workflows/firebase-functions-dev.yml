name: Deploy Gmail backend (development)

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'deploy-gmail-dev' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-development-gmail-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Configure Gmail backend
        env:
          GMAIL_OAUTH_REDIRECT_URI: ${{ vars.GMAIL_OAUTH_REDIRECT_URI }}
          GMAIL_ALLOWED_ORIGINS: ${{ vars.GMAIL_ALLOWED_ORIGINS }}
        run: |
          test -n "$GMAIL_OAUTH_REDIRECT_URI" || { echo "::error::Set the GMAIL_OAUTH_REDIRECT_URI repository variable"; exit 1; }
          test -n "$GMAIL_ALLOWED_ORIGINS" || { echo "::error::Set the GMAIL_ALLOWED_ORIGINS repository variable"; exit 1; }
          printf 'GMAIL_OAUTH_REDIRECT_URI=%s\nGMAIL_ALLOWED_ORIGINS=%s\n' \
            "$GMAIL_OAUTH_REDIRECT_URI" "$GMAIL_ALLOWED_ORIGINS" > functions/.env.badminton-ledger

      - name: Install backend dependencies
        working-directory: functions
        run: npm ci

      - name: Test Gmail backend
        working-directory: functions
        run: npm test

      - name: Authenticate Firebase deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Gmail backend
        run: npx --yes firebase-tools@15.28.1 deploy --only functions:gmail --project badminton-ledger --non-interactive
